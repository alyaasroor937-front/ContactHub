<!-- start model -->

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Add New Contact</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
<div class="text-center mb-3">
    <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
        <i class="fa-solid fa-user fa-2x"></i>
    </div>
    <div>
        <button type="button" class="btn btn-sm btn-light mt-2">Change Photo</button>
    </div>
</div>
<div class="mb-3">
    <label for="fullName">Full Name <span class="text-danger">*</span></label>
    <input type="text" class="form-control mt-2" id="fullName" placeholder="Enter full name">
</div>
<div class="mb-3">
    <label for="phoneNumber">Phone Number<span class="text-danger">*</span></label>
    <input type="number" class="form-control mt-2" id="phoneNumber" placeholder="e.g.,01012345678">
</div>
<div class="mb-3">
    <label for="emailAddres">Email Address<span class="text-danger">*</span></label>
    <input type="email" class="form-control mt-2" id="emailAddres" placeholder="name@example.com">
</div>
<div class="mb-3">
    <label for="address"> Address<span class="text-danger">*</span></label>
    <input type="text" class="form-control mt-2" id="address" placeholder="Enter Address">
</div>
<div class="mb-3">
    <label for="group" class="form-label">Group</label>
    <select name="group" id="group" class="form-select">
        <option value="Select a group" selected disabled>Select a group</option>
        <option value="family">Family</option>
        <option value="frindes">Frendid</option>
        <option value="work">Work</option>
        <option value="school">School</option>
        <option value="other">other</option>
    </select>
</div>

<div class="mb-3">
    <label for="notes">Notes</label>
    <input  type="text" class="form-control mt-2  notes" id="notes" placeholder="Add Notes About this contact">
</div>
<div class="d-flex align-items-center justify-content-start gap-3">
<div class="d-flex align-items-center justify-content-center g-3">
<input type="checkbox" class=" w-50 me-2">
<span class="d-flex align-items-center justify-content-center gap-2"><i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>Favorite</span>
</div>
<div class="d-flex align-items-center justify-content-center g-3">
<input type="checkbox" class=" w-50 me-2">
<span class="d-flex align-items-center justify-content-center gap-2"><i class="fa-solid fa-heart-pulse text-danger"></i>Emergency</span>
</div>
</div>
        </form>
      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button type="button" class="btn btn-secondary w-25 btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary w-50 btn-footer d-flex justify-content-center align-items-center gap-2"><i class="fa-sharp fa-solid fa-check" style="color: white;"></i>Save Contact</button>
      </div>
    </div>
  </div>
</div>

 <!-- end model -->
